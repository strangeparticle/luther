# Single source of truth for the published version. See docs/README_Versions.md.
# Nothing else holds the literal version string; the generated LutherVersion.kt and the
# Gradle project version are both derived from this line.
lutherVersion=0.1.0

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.useAndroidX=true
